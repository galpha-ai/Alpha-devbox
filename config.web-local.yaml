assistant_name: Devbox
data_root: .devbox-local

container:
  runtime: docker
  image: devbox-runner:latest
  timeout: 5400000
  idle_timeout: 300000
  max_concurrent: 2
  max_output_size: 10485760

web:
  enabled: true
  port: 18092
  # Required: web requests are refused until a password is configured.
  # Override with the WEB_ACCESS_PASSWORD env var in real deployments.
  access_password: local-dev-password

agents:
  - name: localqa
    path: agents/localqa

channels:
  - id: "web:*"
    agents:
      - name: localqa
        requires_trigger: false
