[package]
name = "ql-ingest"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Low-latency parsers/normalizers for raw market data feeds (FINRA Reg SHO, CBOE option chains)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "ql-ingest"
path = "src/main.rs"
