name: Publish essay site

# Publishes essay-site/ to GitHub Pages.
# Enable in repo Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches:
      - main
      - claude/robotics-future-essay-18rtk8
    paths:
      - "essay-site/**"
      - "docs/essays/physical-intelligence-2030*.md"
      - ".github/workflows/essay-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate index.html from source markdown
        run: node essay-site/build.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: essay-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
