name: Publish essay site

# Publishes essay-site/ to GitHub Pages on pushes to main.
#
# ONE-TIME SETUP (required once, by a repo admin):
#   repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
# The Actions token cannot self-enable Pages under this org's policy, so this
# toggle must be flipped manually. After that, every push to main that touches
# the essay or the site redeploys automatically to:
#   https://galpha-ai.github.io/Alpha-devbox/
#
# To deploy from a feature branch before merging, run this workflow manually
# (Actions → "Publish essay site" → Run workflow → pick the branch).

on:
  push:
    branches: [main]
    paths:
      - "essay-site/**"
      - "docs/essays/physical-intelligence-2030*.md"
      - ".github/workflows/essay-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate pages from source markdown
        run: node essay-site/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: essay-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
